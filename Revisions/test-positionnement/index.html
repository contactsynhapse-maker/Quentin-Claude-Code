<title>Test de positionnement A2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,600;100,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : une colonne de lecture (≤ 860 px), bandeau en papier millimétré, une carte par question. */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --ink: #162033;
  --muted: #5a6478;
  --line: #d8dde6;
  --grid: rgba(35, 64, 184, 0.07);
  --accent: #2340b8;
  --accent-ink: #ffffff;
  --accent-soft: #e7ecfb;
  --ok: #17713f;
  --ok-soft: #e2f3e8;
  --ko: #b32317;
  --ko-soft: #fcebe9;
  --warn: #8a5a00;
  --warn-soft: #fff3d6;
  --paper: #ffffff;
  --fig-old: #6b7488;
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d121b; --surface: #151c29; --ink: #e6eaf2; --muted: #9ba6ba; --line: #283246;
    --grid: rgba(142, 168, 255, 0.07); --accent: #8ea8ff; --accent-ink: #0d121b; --accent-soft: #1d2846;
    --ok: #63d394; --ok-soft: #10301e; --ko: #ff8f80; --ko-soft: #3a1612; --warn: #f2bd5b; --warn-soft: #34270c;
    --paper: #ffffff; --fig-old: #9ba6ba; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d121b; --surface: #151c29; --ink: #e6eaf2; --muted: #9ba6ba; --line: #283246;
  --grid: rgba(142, 168, 255, 0.07); --accent: #8ea8ff; --accent-ink: #0d121b; --accent-soft: #1d2846;
  --ok: #63d394; --ok-soft: #10301e; --ko: #ff8f80; --ko-soft: #3a1612; --warn: #f2bd5b; --warn-soft: #34270c;
  --paper: #ffffff; --fig-old: #9ba6ba; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 860px; margin: 0 auto; padding-block: 20px 64px; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); font-stretch: 100%; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Bandeau */
.mast {
  border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 22px 18px;
  background-color: var(--surface);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 18px 18px;
  display: flex; flex-direction: column; gap: 8px;
}
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.mast h1 { font-size: clamp(28px, 6vw, 42px); font-weight: 800; line-height: 1.05; }
.mast p { margin: 0; color: var(--muted); max-width: 62ch; }

/* Boutons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 16px; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; filter: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spacer { flex: 1; }

/* Accueil */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { font-size: 20px; font-weight: 800; }
.label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.chip { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--surface); }
.chip .box { width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.chip[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.chip[aria-pressed="true"] .box::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--accent-ink); border-bottom: 2px solid var(--accent-ink); transform: translateY(-1px) rotate(-45deg); }
.chip .name { flex: 1; min-width: 0; }
.chip .count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.chip .new { font-family: var(--font-mono); font-size: 11px; color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 8px 14px; font-weight: 600; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.howto { margin: 0; padding-left: 20px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.resume { border-color: var(--accent); }

/* Barre de progression */
.bar { display: flex; flex-direction: column; gap: 8px; }
.bar .meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar .meter span { display: block; height: 100%; background: var(--accent); transition: width 0.25s ease; }
.score-pill { font-family: var(--font-mono); font-size: 13px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.score-pill.okc { color: var(--ok); }
.score-pill.koc { color: var(--ko); }

/* Plan des questions */
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.map button { font-family: var(--font-mono); font-size: 12px; padding: 6px 0; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }
.map button.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.map button.ko { background: var(--ko-soft); border-color: var(--ko); color: var(--ko); }
.map button.cur { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Carte question */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tag { font-family: var(--font-mono); font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.tag.src { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.qnum { font-family: var(--font-display); font-weight: 800; font-size: 15px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.prompt { font-size: 18.5px; line-height: 1.55; min-width: 0; overflow-wrap: anywhere; }
.prompt mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; }
.shots { display: flex; flex-wrap: wrap; gap: 12px; }
.shot { margin: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-width: 100%; display: flex; justify-content: center; }
.shot img { max-height: min(70vh, 620px); width: auto; max-width: 100%; display: block; cursor: zoom-in; }
.figbox { background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; }
.fig { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto; }
.fig line.old, .fig polygon.old-h { stroke: var(--fig-old); fill: var(--fig-old); stroke-width: 2; }
.fig line.new, .fig polygon.new-h { stroke: var(--accent); fill: var(--accent); stroke-width: 2.4; }
.fig polygon.old-h, .fig polygon.new-h { stroke-width: 0; }
.fig .arc { fill: none; stroke: var(--ink); stroke-width: 1.2; }
.fig .axis { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }
.fig .dot { fill: var(--ink); }
.fig text { font-family: var(--font-body); fill: var(--ink); font-size: 15px; }
.fig text.new-t { fill: var(--accent); font-weight: 700; }
.fig text.ttl { font-family: var(--font-mono); font-size: 12px; fill: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.fig text.ang { font-style: italic; font-size: 14px; }
.fig text.small { font-size: 13px; fill: var(--muted); }
.fig text.num { font-family: var(--font-display); font-weight: 800; font-size: 17px; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.fig .ring { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.4; }
.fig .ring-in { fill: var(--surface); stroke: var(--ink); stroke-width: 1.1; }
.fig .sat { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.1; }
.fig .sun { fill: var(--ok-soft); stroke: var(--ink); stroke-width: 1.1; }
.fig .carrier { stroke: var(--accent); stroke-width: 7; stroke-linecap: round; opacity: 0.85; }
.fig .pin { fill: var(--surface); stroke: var(--accent); stroke-width: 2.4; }

.kmap-wrap { overflow-x: auto; margin-top: 10px; }
.kmap { border-collapse: collapse; font-family: var(--font-mono); font-size: 15px; }
.kmap caption { caption-side: top; text-align: left; font-family: var(--font-body); font-size: 13px; color: var(--muted); padding-bottom: 4px; }
.kmap th, .kmap td { border: 1px solid var(--line); padding: 6px 12px; text-align: center; }
.kmap th { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.kmap th.corner { font-size: 12px; }

/* Réponses */
.opts { display: flex; flex-direction: column; gap: 8px; }
.opts.tf { flex-direction: row; flex-wrap: wrap; }
.opts.tf .opt { flex: 1 1 160px; }
.hint { font-size: 14px; color: var(--muted); margin: 0; }
.opt { display: flex; align-items: flex-start; gap: 12px; text-align: left; width: 100%; border: 1.5px solid var(--line); border-radius: 9px; background: var(--surface); padding: 11px 14px; min-width: 0; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .key { font-family: var(--font-mono); font-size: 12px; font-weight: 700; flex: none; width: 24px; height: 24px; border-radius: 6px; border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--muted); margin-top: 1px; }
.opts.multi .opt .key { border-radius: 5px; }
.opt .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .txt mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; vertical-align: middle; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt[disabled] { cursor: default; }
.opt.is-correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-correct .key { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.is-wrong { border-color: var(--ko); background: var(--ko-soft); }
.opt.is-wrong .key { background: var(--ko); border-color: var(--ko); color: var(--surface); }
.opt.is-missed { border-style: dashed; border-color: var(--ok); }
.opt .flag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; align-self: center; flex: none; }
.opt.is-correct .flag { color: var(--ok); }
.opt.is-wrong .flag { color: var(--ko); }
.opt.is-missed .flag { color: var(--ok); }
.field { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.field input { border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); padding: 10px 12px; width: min(320px, 100%); font-family: var(--font-mono); }
.field input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.field input.ok { border-color: var(--ok); background: var(--ok-soft); }
.field input.ko { border-color: var(--ko); background: var(--ko-soft); }
.unit { font-family: var(--font-mono); color: var(--muted); }
.match { display: flex; flex-direction: column; gap: 8px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 260px); gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
.mrow .ml { min-width: 0; overflow-wrap: anywhere; }
.mrow .ml mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; }
.mrow select { width: 100%; border: 1.5px solid var(--line); border-radius: 7px; padding: 8px; background: var(--surface); }
.mrow.ok { border-color: var(--ok); background: var(--ok-soft); }
.mrow.ko { border-color: var(--ko); background: var(--ko-soft); }
.mrow .fix { grid-column: 1 / -1; font-size: 14px; color: var(--ok); font-weight: 600; }
@media (max-width: 560px) { .mrow { grid-template-columns: 1fr; } }

/* Correction */
.verdict { display: flex; flex-direction: column; gap: 4px; border-radius: 9px; padding: 12px 14px; font-weight: 600; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.ko { background: var(--ko-soft); color: var(--ko); }
.verdict .exp { font-weight: 400; color: var(--ink); }
.expl { border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
.expl summary { cursor: pointer; padding: 10px 14px; font-weight: 700; font-family: var(--font-display); }
.expl .body { padding: 0 14px 14px; overflow-wrap: anywhere; }
.expl .body mjx-container[display="true"] { overflow-x: auto; }
.note { border-left: 4px solid var(--warn); background: var(--warn-soft); border-radius: 0 8px 8px 0; padding: 10px 14px; font-size: 15.5px; }
.note b { color: var(--warn); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Résultats */
.big { font-family: var(--font-display); font-weight: 800; font-size: clamp(44px, 10vw, 64px); line-height: 1; font-variant-numeric: tabular-nums; }
.res-table { width: 100%; border-collapse: collapse; }
.res-table td, .res-table th { padding: 9px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.res-table th { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }
.res-table td.n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 70px; }
.track span { display: block; height: 100%; border-radius: 4px; }
.lvl { font-family: var(--font-mono); font-size: 12px; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.lvl.a { background: var(--ok-soft); color: var(--ok); }
.lvl.b { background: var(--warn-soft); color: var(--warn); }
.lvl.c { background: var(--ko-soft); color: var(--ko); }
.res-scroll { overflow-x: auto; }
.misslist { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.misslist button { width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 9px 12px; display: flex; gap: 10px; }
.misslist button:hover { border-color: var(--accent); }
.misslist .mid { font-family: var(--font-mono); font-size: 13px; color: var(--ko); flex: none; width: 52px; }
.misslist .mtx { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }

/* Zoom image */
.lightbox { position: fixed; inset: 0; background: rgba(8, 12, 20, 0.82); display: grid; place-items: center; z-index: 10; cursor: zoom-out;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
[hidden] { display: none !important; }
.lightbox img { max-width: 100%; max-height: 100%; background: #ffffff; border-radius: 8px; padding: 10px; }
.foot { font-size: 13px; color: var(--muted); text-align: center; }
@media (max-width: 560px) { body { font-size: 16px; } .card, .panel { padding: 16px; } .prompt { font-size: 17px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const DATA = {"questions":[{"id":"T1","sec":"maths","kind":"single","q":"Parmi les fonctions suivantes, laquelle est une primitive de \\(\\dfrac{\\cos(3x)}{3}\\) ?","ans":0,"expl":"Une primitive de \\(\\cos(ax)\\) est \\(\\dfrac{\\sin(ax)}{a}\\). Donc \\(\\dfrac13\\cdot\\dfrac{\\sin(3x)}{3}=\\dfrac{\\sin(3x)}{9}\\). Vérification : \\(\\left(\\dfrac{\\sin 3x}{9}\\right)'=\\dfrac{3\\cos 3x}{9}=\\dfrac{\\cos 3x}{3}\\).","src":"test","opts":["\\(\\dfrac{\\sin(3x)}{9}\\)","\\(-3\\sin(3x)\\)","\\(-\\dfrac{\\sin(3x)}{3}\\)","\\(\\sin(3x)\\)"]},{"id":"T2","sec":"constr","kind":"single","q":"L'épaulement est la combinaison de :","ans":2,"expl":"Un épaulement = un cylindre obtenu par <b>chariotage<\/b> (outil parallèle à l'axe) + une face plane perpendiculaire obtenue par <b>dressage<\/b> (outil perpendiculaire à l'axe).","src":"test","opts":["Profilage et dressage","Chariotage et profilage","Chariotage et dressage","Dressage et rainurage"]},{"id":"T3","sec":"meca","kind":"text","q":"Un solide en équilibre soumis à 3 efforts (non parallèles) voit les directions de ces efforts… <i>(un seul mot)<\/i>","ans":["concourantes","concourante","concourants","concourant","concourent","concourir"],"expl":"Elles sont <b>concourantes<\/b> : 3 forces non parallèles qui maintiennent un solide en équilibre sont coplanaires, leurs droites d'action passent par un même point, et leur somme vectorielle est nulle (triangle des forces fermé).","src":"test","shown":"concourantes"},{"id":"T4","sec":"maths","kind":"single","q":"Soit \\(u(x)\\) dérivable sur \\(\\mathbb R\\). La dérivée de \\(\\cos(u(x))\\) est :","ans":3,"expl":"Dérivée d'une composée : \\((\\cos u)' = u'\\times\\cos'(u) = -u'\\sin u\\).","src":"test","opts":["\\(\\sin(u(x))\\)","\\(\\cos(u'(x))\\)","\\(u'(x)\\sin(u(x))\\)","\\(-u'(x)\\sin(u(x))\\)"]},{"id":"T5","sec":"auto","kind":"single","q":"Donner le nom du symbole :","ans":3,"expl":"Le type de commande manuelle se lit sur le petit signe placé devant le trait pointillé : <b>créneau en « F »<\/b> = rotative ; <b>crochet [<\/b> = poussoir ; <b>demi-cercle (<\/b> = coup de poing (arrêt d'urgence) ; <b>trait oblique terminé par un rond<\/b> = levier.","src":"test","opts":["Contact de relai de commande","Commande mécanique manuelle par poussoir","Commande mécanique manuelle par levier","Commande mécanique manuelle rotative","Commande mécanique manuelle « coup de poing »"],"img":["q005.png"]},{"id":"T6","sec":"fr","kind":"tf","q":"L'annonce du plan de l'écriture personnelle se fait au conditionnel.","ans":1,"expl":"On annonce le plan au présent ou au futur (« nous verrons d'abord… puis… »). Le conditionnel exprime une hypothèse et affaiblit l'annonce.","src":"test","opts":["Vrai","Faux"]},{"id":"T7","sec":"maths","kind":"single","q":"On considère le complexe \\(z=\\dfrac{1-i\\sqrt3}{2i}\\). Quelles sont ses coordonnées dans le plan complexe ?","ans":1,"expl":"\\(\\dfrac{1}{2i}=\\dfrac{-i}{2}\\) (car \\(i\\times(-i)=1\\)). Donc \\(z=\\dfrac{(1-i\\sqrt3)(-i)}{2}=\\dfrac{-i+i^2\\sqrt3}{2}=\\dfrac{-\\sqrt3-i}{2}\\). Partie réelle \\(-\\frac{\\sqrt3}{2}\\), partie imaginaire \\(-\\frac12\\).","src":"test","opts":["\\(\\left(\\dfrac{\\sqrt3}{2};\\dfrac12\\right)\\)","\\(\\left(-\\dfrac{\\sqrt3}{2};-\\dfrac12\\right)\\)","\\(\\left(-\\dfrac12;-\\dfrac{\\sqrt3}{2}\\right)\\)","\\(\\left(-\\dfrac12;\\dfrac{\\sqrt3}{2}\\right)\\)"]},{"id":"T8","sec":"auto","kind":"multi","q":"Cochez la ou les bonnes réponses : \\((a+b+c)\\cdot\\overline{c}=\\)","ans":[1,3],"expl":"On développe : \\(a\\overline c+b\\overline c+c\\,\\overline c\\). Or \\(c\\cdot\\overline c=0\\). Il reste \\(a\\overline c+b\\overline c=\\overline c\\,(a+b)\\) : les deux écritures sont équivalentes.","src":"test","opts":["\\((a+b)\\cdot\\overline c+c\\)","\\(a\\cdot\\overline c+b\\cdot\\overline c\\)","\\(a+b\\)","\\(\\overline c\\cdot(a+b)\\)"]},{"id":"T9","sec":"auto","kind":"single","q":"Donner le type de capteur ou détecteur ci-contre :","ans":1,"expl":"On voit un <b>disque gradué<\/b>, une DEL, un réticule et un axe avec accouplement : c'est un <b>codeur optique<\/b> qui mesure une position angulaire (incrémental ou absolu).","src":"test","opts":["Détecteur de proximité capacitif","Codeur optique de position angulaire","Capteur de position électromécanique","Détecteur photoélectrique « barrage »","Détecteur photoélectrique « reflex »","Détecteur de proximité inductif"],"img":["q009.jpg"]},{"id":"T10","sec":"auto","kind":"single","q":"Ce symbole d'un schéma électrique représente :","ans":1,"expl":"Nombre de pôles = nombre de lignes de puissance (3 → tripolaire). Le <b>demi-cercle<\/b> sur chaque pôle symbolise le déclencheur <b>magnétique<\/b> (court-circuit) ; le <b>créneau rectangulaire<\/b> symbolise le déclencheur <b>thermique<\/b> (surcharge). Les deux ensemble → magnétothermique. Ici il n'y a que des demi-cercles → <b>magnétique tripolaire<\/b>.","src":"test","opts":["Un disjoncteur thermique tripolaire","Un disjoncteur magnétique tripolaire","Un disjoncteur magnétothermique tripolaire","Un disjoncteur magnétothermique bipolaire","Un disjoncteur magnétique bipolaire","Un disjoncteur thermique bipolaire"],"img":["q010.png"]},{"id":"T11","sec":"maths","kind":"single","q":"Une solution de l'équation différentielle \\(y'+2y=-\\dfrac43\\) est :","ans":1,"expl":"Solutions : \\(y=Ce^{-2x}+y_p\\), avec \\(y_p\\) constante : \\(2y_p=-\\frac43\\Rightarrow y_p=-\\frac23\\). Avec \\(C=1\\) : \\(e^{-2x}-\\frac23\\). Vérif : \\(y'+2y=-2e^{-2x}+2e^{-2x}-\\frac43\\) ✓.","src":"test","opts":["\\(-e^{2x}+\\dfrac43\\)","\\(e^{-2x}-\\dfrac23\\)","\\(-\\dfrac12e^{x^2}+\\dfrac23\\)","\\(e^{-2x}-\\dfrac43\\)"]},{"id":"T12","sec":"elec","kind":"single","q":"Un réseau linéaire de bornes A et B est modélisé par un générateur de Thévenin (E<sub>Th<\/sub>, R<sub>Th<\/sub>). Quelle affirmation est <b>erronée<\/b> ?","ans":2,"expl":"E<sub>Th<\/sub> est la <b>tension à vide<\/b> (I = 0). En court-circuit, U<sub>AB<\/sub> = 0 par définition : on y mesure le courant de Norton I<sub>N<\/sub> = E<sub>Th<\/sub>/R<sub>Th<\/sub>, pas E<sub>Th<\/sub>.","src":"test","opts":["Pour trouver E<sub>Th<\/sub>, on détermine U<sub>AB<\/sub> lorsque le circuit est ouvert en A ou B (donc I = 0).","Pour trouver R<sub>Th<\/sub>, on détermine la résistance équivalente du réseau, toutes les sources indépendantes étant éteintes.","Pour trouver E<sub>Th<\/sub>, on détermine U<sub>AB<\/sub> lorsque l'on court-circuite A et B (donc U<sub>AB<\/sub> = 0)."],"img":["q012.png"]},{"id":"T13","sec":"maths","kind":"single","q":"Le discriminant du polynôme \\(P(x)=x^2-4x+5\\) vaut :","ans":1,"expl":"\\(\\Delta=b^2-4ac=16-20=-4\\) (négatif : pas de racine réelle).","src":"test","opts":["−36","−4","4","0"]},{"id":"T14","sec":"fr","kind":"tf","q":"Une conclusion d'écriture personnelle répond obligatoirement à la problématique.","ans":0,"expl":"La conclusion apporte une réponse claire à la problématique posée en introduction, puis peut ouvrir.","src":"test","opts":["Vrai","Faux"]},{"id":"T15","sec":"maths","kind":"single","q":"Soit \\(g(x)=\\dfrac{3x+4}{7-2x}\\). Sa dérivée est :","ans":3,"expl":"\\(\\left(\\dfrac uv\\right)'=\\dfrac{u'v-uv'}{v^2}\\) avec \\(u'=3\\), \\(v'=-2\\) : \\(3(7-2x)+2(3x+4)=21-6x+6x+8=29\\).","src":"test","opts":["\\(\\dfrac{-27x-7}{(7-2x)^2}\\)","\\(\\dfrac{13}{(7-2x)^2}\\)","\\(-\\dfrac32\\)","\\(\\dfrac{29}{(7-2x)^2}\\)"]},{"id":"T16","sec":"gestion","kind":"multi","q":"Parmi ces caractéristiques de Bouygues Construction, cochez les <b>menaces<\/b> du diagnostic externe.","ans":[1,2],"expl":"Le diagnostic externe (opportunités / menaces) porte sur l'<b>environnement<\/b> : réglementation, taux d'intérêt, marché. La cyberattaque et la perte semestrielle concernent l'entreprise elle-même (diagnostic interne → faiblesses) ; la tour en Grèce est une force.","src":"test","opts":["L'affaire de la cyberattaque de Bouygues en 2020 n'est pas encore réglée.","Pour les nouveaux permis de construire, il faut créer des bâtiments à énergie positive, ce qui augmente énormément les coûts de construction.","Les taux d'intérêt (d'emprunt) augmentent.","Bouygues affiche une perte de 134 millions d'euros au premier semestre 2023.","Bouygues va réaliser la plus haute tour de Grèce."]},{"id":"T17","sec":"auto","kind":"match","q":"Associez le vocabulaire du Grafcet aux repères 1 à 9 de la figure.","ans":[4,0,6,3,1,7,2,5,8],"expl":"Étape initiale = <b>double carré<\/b> (5). Divergence / convergence en OU = <b>trait simple<\/b> qui se sépare (4) ou se rejoint (7). Divergence / convergence en ET = <b>double trait<\/b> (3 et 2). L'action est le rectangle à droite d'une étape (8), la transition le petit trait horizontal (6), la réceptivité la condition écrite à côté (9).","src":"test","opts":["Repère 1","Repère 2","Repère 3","Repère 4","Repère 5","Repère 6","Repère 7","Repère 8","Repère 9"],"img":["q017.png"],"note":"La flèche 1 vise l'étape 50 avec son action ; la correction du test l'associe à « Étape » et garde 8 pour « Action ».","items":["Étape initiale","Étape","Convergence en OU","Divergence en OU","Convergence en ET","Action","Divergence en ET","Transition","Réceptivité"]},{"id":"T18","sec":"constr","kind":"num","q":"Donner, en mm, l'ajustement <b>minimal<\/b> 10 H9 f8 (valeur exacte, signe + = jeu, signe − = serrage).<br>Écarts pour un diamètre de 6 à 10 mm : <b>H9<\/b> = +36 / 0 µm ; <b>f8<\/b> = −13 / −35 µm.","ans":0.013,"expl":"Jeu mini = alésage mini − arbre maxi = (10 + 0) − (10 − 0,013) = <b>+0,013 mm<\/b>. (Jeu maxi = 0,036 + 0,035 = 0,071 mm.)","src":"test","tol":0.0005,"unit":"mm"},{"id":"T19","sec":"gestion","kind":"multi","q":"La SARL, c'est :","ans":[0,2,3],"expl":"SARL : responsabilité <b>limitée aux apports<\/b>, société « hybride » (entre société de personnes et de capitaux), fonctionnement fixé par des <b>statuts<\/b>, dirigée par un ou plusieurs <b>gérants<\/b>, de 1 (EURL) à 100 associés.","src":"test","opts":["Une société à responsabilité limitée que l'on appelle aussi société hybride","Une société dont les associés sont responsables sur leurs biens personnels","Une société dont les règles de fonctionnement sont définies dans des statuts","Une société dont le responsable est le gérant","Une société avec au moins 2 associés et sans maximum d'associés"],"note":"La correction du test ne retenait que a et c. La SARL est pourtant bien dirigée par un gérant (d)."},{"id":"T20","sec":"anglais","kind":"single","q":"Next year I ______ at Airbus.","ans":1,"expl":"Action en cours à un moment du futur → futur progressif <b>will be working<\/b>.","src":"test","opts":["have worked","will be working","work"]},{"id":"T21","sec":"auto","kind":"multi","q":"Grafcet : cochez les bonnes cases.","ans":[1,2,4],"expl":"Réponses attendues par la correction : b, c et e. L'étape initiale (double carré) est active au démarrage et garantit l'état initial du système.","src":"test","opts":["L'état initial remet le système en condition initiale","L'étape initiale est toujours en début de grafcet","Une étape initiale ne peut être forcée","Il peut y avoir plusieurs étapes initiales dans un même grafcet","L'étape initiale garantit l'état initial"],"note":"Selon la norme Grafcet (IEC 60848), un grafcet peut en fait contenir plusieurs étapes initiales (d) ; la correction du test ne la retenait pas."},{"id":"T22","sec":"maths","kind":"single","q":"Quel est le DL à l'ordre 3 en 0 de \\(\\exp(x)\\) ?","ans":1,"expl":"\\(e^x=\\sum \\dfrac{x^k}{k!}=1+x+\\dfrac{x^2}{2}+\\dfrac{x^3}{6}+x^3\\varepsilon(x)\\) : tous les signes sont +, et le terme constant vaut 1.","src":"test","opts":["\\(x+\\dfrac{x^2}{2}+\\dfrac{x^3}{3!}+x^3\\varepsilon(x)\\)","\\(1+x+\\dfrac{x^2}{2}+\\dfrac{x^3}{6}+x^3\\varepsilon(x)\\)","\\(1-x+\\dfrac{x^2}{2}-\\dfrac{x^3}{3!}+x^3\\varepsilon(x)\\)","\\(1+x-\\dfrac{x^2}{2}+\\dfrac{x^3}{6}+x^3\\varepsilon(x)\\)"]},{"id":"T23","sec":"elec","kind":"single","q":"On dispose de l'ALI ci-contre alimenté par \\(\\pm V_{alim}\\). Quelle propriété est <b>erronée<\/b> ?","ans":0,"expl":"Les courants d'entrée sont quasi nuls (pA) : ils ne peuvent pas fournir le courant de sortie. Le courant de sortie (quelques dizaines de mA au maximum) vient des alimentations (i<sub>p+<\/sub>, i<sub>p−<\/sub>).","src":"test","opts":["\\(i_{S\\max}\\simeq i^++i^-\\simeq 20\\ \\text{mA}\\)","\\(V_{alim^-}<V_S<V_{alim^+}\\)","\\(i^-\\simeq i^+\\simeq 0\\ (\\simeq 10\\ \\text{pA})\\)"],"img":["q023.png"]},{"id":"T24","sec":"constr","kind":"text","q":"Un matériau qui ne possède pas les mêmes propriétés dans toutes les directions de l'espace est dit :","ans":["anisotrope","non isotrope","nonisotrope","pas isotrope"],"expl":"<b>Anisotrope<\/b> (non isotrope) : bois, composites à fibres, tôles laminées. Isotrope = mêmes propriétés dans toutes les directions.","src":"test","shown":"anisotrope"},{"id":"T25","sec":"fr","kind":"tf","q":"Le langage familier est un des niveaux de langue.","ans":0,"expl":"Trois niveaux de langue : familier, courant, soutenu.","src":"test","opts":["Vrai","Faux"]},{"id":"T26","sec":"auto","kind":"match","q":"Bascule JK (front montant) : complétez la sortie Q<sub>n+1<\/sub>.","ans":[0,0,0,1,2,4],"expl":"Sans front montant, Q garde son état. Sur ↑ : J = K = 0 → mémoire ; J = 0, K = 1 → mise à 0 ; J = 1, K = 0 → mise à 1 ; J = K = 1 → <b>basculement<\/b> (Q prend Q̄n). Pas d'état interdit, contrairement à la bascule RS.","src":"test","opts":["État précédent","0","1","Qn","Q̄n (basculement)","État interdit"],"img":["q026.png"],"items":["J = x, K = x, H = ↓ (front descendant)","J = x, K = x, H = x (pas de front)","J = 0, K = 0, H = ↑","J = 0, K = 1, H = ↑","J = 1, K = 0, H = ↑","J = 1, K = 1, H = ↑"]},{"id":"T27","sec":"constr","kind":"single","q":"Le nom commercial Inconel fait référence à une famille :","ans":1,"expl":"L'Inconel est un <b>superalliage<\/b> base nickel-chrome, utilisé à haute température (turbines, échappements).","src":"test","opts":["d'alliages d'aluminium","de superalliages","de fontes","d'alliages d'acier"]},{"id":"T28","sec":"auto","kind":"single","q":"Donner le nom du symbole :","ans":4,"expl":"Bobine (rectangle avec A1/A2) = <b>relai<\/b> ; trait de contact avec NO = <b>contact<\/b>. Bobine simple = relai ordinaire ; case <b>noircie<\/b> = relai temporisé <b>au repos<\/b> (retombée retardée) ; case avec une <b>croix<\/b> = relai temporisé <b>à l'action<\/b> (appel retardé). Sur un contact, le petit demi-cercle (« parachute ») indique la temporisation : il freine le contact dans un seul sens, à la fermeture (action retardée) ou à l'ouverture (repos retardé).","src":"test","opts":["Relai de commande","Relai de commande à action retardée","Relai de commande à repos retardé","Contact de relai de commande","Contact de relai de commande à action retardée","Contact de relai de commande à repos retardé"],"img":["q028.png"]},{"id":"T29","sec":"elec","kind":"single","q":"La fonction de transfert harmonique du circuit RC ci-contre (sortie u aux bornes de C) est :","ans":1,"expl":"Diviseur de tension : \\(\\underline H=\\dfrac{Z_C}{R+Z_C}\\) avec \\(Z_C=\\dfrac{1}{jC\\omega}\\). On multiplie par \\(jC\\omega\\) : \\(\\underline H=\\dfrac{1}{1+jRC\\omega}\\) (passe-bas du 1er ordre).","src":"test","opts":["\\(\\underline H(j\\omega)=\\dfrac{R}{R+jC\\omega}\\)","\\(\\underline H(j\\omega)=\\dfrac{1}{1+jRC\\omega}\\)","\\(\\underline H(j\\omega)=\\dfrac{jC\\omega}{R+jC\\omega}\\)"],"img":["q029.png"]},{"id":"T30","sec":"maths","kind":"single","q":"Quel complexe est le résultat du produit de \\(5e^{i\\frac{4\\pi}{9}}\\), \\(1{,}8e^{-i\\frac{\\pi}{3}}\\) et \\(e^{i\\frac{2\\pi}{9}}\\) ?","ans":0,"expl":"On multiplie les modules : \\(5\\times1{,}8\\times1=9\\). On additionne les arguments : \\(\\frac{4\\pi}{9}-\\frac{3\\pi}{9}+\\frac{2\\pi}{9}=\\frac{3\\pi}{9}=\\frac{\\pi}{3}\\).","src":"test","opts":["\\(9e^{i\\frac{\\pi}{3}}\\)","\\(9e^{i\\frac{\\pi}{9}}\\)","\\(6{,}8e^{i\\frac{\\pi}{9}}\\)","\\(6{,}8e^{i\\frac{\\pi}{3}}\\)"]},{"id":"T31","sec":"elec","kind":"single","q":"Dans le circuit ci-contre :","ans":1,"expl":"Loi des nœuds : somme des courants entrants = somme des courants sortants, donc I = I<sub>1<\/sub> + I<sub>2<\/sub>. I<sub>1<\/sub> = I<sub>2<\/sub> seulement si R<sub>1<\/sub> = R<sub>2<\/sub>. U<sub>AB<\/sub> = R<sub>1<\/sub>I<sub>1<\/sub> est la loi d'Ohm, pas la loi des mailles.","src":"test","opts":["D'après la loi des nœuds, I<sub>1<\/sub> = I<sub>2<\/sub>.","D'après la loi des nœuds, I − I<sub>1<\/sub> − I<sub>2<\/sub> = 0.","D'après la loi des mailles, U<sub>AB<\/sub> = R<sub>1<\/sub>·I<sub>1<\/sub>."],"img":["q031.png"]},{"id":"T32","sec":"constr","kind":"match","q":"Identifier les différents éléments filetés (repères 1 à 4).","ans":[0,1,2,3],"expl":"<b>Vis<\/b> : une tête + une tige filetée. <b>Goujon<\/b> : tige filetée aux deux bouts, sans tête. <b>Boulon<\/b> : vis + écrou. <b>Écrou<\/b> : pièce hexagonale taraudée.","src":"test","opts":["Vis","Goujon","Boulon","Écrou","Tige filetée"],"img":["q032.png"],"items":["Repère 1","Repère 2","Repère 3","Repère 4"]},{"id":"T34","sec":"meca","kind":"single","q":"Une liaison réalisée par un contact cylindrique de courte portée est une liaison :","ans":1,"expl":"Un cylindre <b>court<\/b> dans un alésage ne bloque que les 2 translations radiales : il reste 3 rotations + la translation axiale = <b>linéaire annulaire<\/b> (sphère-cylindre). Un contact cylindrique <b>long<\/b> donne un pivot glissant.","src":"test","opts":["rotule","linéaire annulaire","pivot","linéaire rectiligne","pivot glissant"]},{"id":"T35","sec":"maths","kind":"single","q":"Soit \\(f(x)=2x+3+\\dfrac9x\\). Sa dérivée est :","ans":1,"expl":"\\((2x)'=2\\), \\((3)'=0\\), \\(\\left(\\dfrac1x\\right)'=-\\dfrac1{x^2}\\). Donc \\(f'(x)=2-\\dfrac9{x^2}\\).","src":"test","opts":["\\(f'(x)=2+3+9\\)","\\(f'(x)=2-\\dfrac{9}{x^2}\\)","\\(f'(x)=2+\\dfrac{9}{x^2}\\)","\\(f'(x)=2+\\dfrac91\\)"]},{"id":"T36","sec":"anglais","kind":"single","q":"I enjoyed my summer ______ at Airbus very much.","ans":1,"expl":"Un stage en entreprise = <b>an internship<\/b>. « Internment » = internement ; « stage » = scène.","src":"test","opts":["internment","internship","stage"]},{"id":"T37","sec":"elec","kind":"single","q":"L'ARQS est vérifiée pour un régime variable si :","ans":1,"expl":"ARQS = approximation des régimes quasi stationnaires. Elle est valable quand le <b>temps de propagation<\/b> du signal dans le circuit est négligeable devant le <b>temps caractéristique<\/b> de variation (τ, T). Conséquence : à chaque instant, le courant est le même en tout point d'une branche. La 3e proposition inverse l'inégalité.","src":"test","opts":["les dimensions du circuit sont grandes (≫ 1 m).","l'intensité du courant est la même en tout point d'une branche du circuit.","le temps caractéristique de sa variation (τ pour un condensateur, T pour un signal du GBF) est petit devant le temps de propagation."],"note":"La correction du test surlignait la 3e proposition, mais elle est écrite à l'envers : c'est le temps de propagation qui doit être petit devant τ ou T."},{"id":"T38","sec":"anglais","kind":"single","q":"The company's ______ are on strike because they want a salary increase.","ans":1,"expl":"Les salariés = <b>employees<\/b>. Employers = employeurs ; employed = participe passé.","src":"test","opts":["employed","employees","employers"]},{"id":"T39","sec":"constr","kind":"single","q":"Quelle est la nature de l'ajustement 10 H9 f8 ?","ans":0,"expl":"Avec un alésage H (EI = 0), les arbres <b>a à h<\/b> donnent du <b>jeu<\/b>, js à n un ajustement incertain, p à z du serrage. Ici l'arbre f8 est toujours plus petit que l'alésage (jeu de 0,013 à 0,071 mm).","src":"test","opts":["Jeu","Serrage","Incertain"]},{"id":"T40","sec":"auto","kind":"tf","q":"Une transition est franchie si : toutes les étapes qui la précèdent immédiatement sont actives ET la réceptivité associée est vraie.","ans":0,"expl":"Règle 2 du Grafcet : la transition est <b>validée<\/b> quand toutes les étapes amont sont actives ; elle est <b>franchie<\/b> si, en plus, sa réceptivité est vraie.","src":"test","opts":["Vrai","Faux"]},{"id":"T41","sec":"constr","kind":"single","q":"Un acier qui comporte la lettre X au début de sa désignation fait partie des :","ans":2,"expl":"X = au moins un élément d'addition ≥ 5 % (ex. X5CrNi18-10, un inox). Sans X avec teneurs codées (42CrMo4) = faiblement allié. C45 = acier non allié.","src":"test","opts":["Aciers faiblement alliés","Aciers au carbone","Aciers fortement alliés","Aciers purs","Aciers superalliages"]},{"id":"T42","sec":"elec","kind":"single","q":"ALI alimenté en \\(\\pm V_{sat}\\), \\(\\varepsilon=v^+-v^-\\). Quelle propriété est <b>erronée<\/b> ?","ans":2,"expl":"L'ALI idéal a une impédance d'entrée <b>infinie<\/b> : c'est pour cela que i<sup>+<\/sup> = i<sup>−<\/sup> = 0. Une impédance nulle donnerait au contraire des courants très grands.","src":"test","opts":["En régime saturé, \\(v_S=+V_{sat}\\) ou \\(v_S=-V_{sat}\\).","En régime linéaire, \\(v_S=\\mu_0\\varepsilon\\) avec \\(\\mu_0\\) de l'ordre de \\(10^5\\).","Lorsque l'ALI est idéal, son impédance d'entrée est nulle, ce qui implique \\(i^+=i^-=0\\)."],"img":["q023.png"]},{"id":"T43","sec":"elec","kind":"single","q":"Dans le circuit ci-contre, identifier la relation <b>erronée<\/b> :","ans":2,"expl":"Diviseur de courant : le courant d'une branche est proportionnel à la résistance de l'<b>autre<\/b> branche : \\(I_1=\\dfrac{R_2}{R_1+R_2}I\\) et \\(I_2=\\dfrac{R_1}{R_1+R_2}I\\).","src":"test","opts":["\\(I=I_1+I_2\\)","\\(I_2=\\dfrac{R_1}{R_1+R_2}I\\)","\\(I_1=\\dfrac{R_1}{R_1+R_2}I\\)"],"img":["q043.png"]},{"id":"T44","sec":"maths","kind":"single","q":"La dérivée de \\(f(x)=x^2e^x\\) vaut :","ans":2,"expl":"\\((uv)'=u'v+uv'\\) : \\(2xe^x+x^2e^x=xe^x(2+x)\\).","src":"test","opts":["\\(x^2e^x\\)","\\(2xe^x+x^2\\)","\\(xe^x(2+x)\\)","\\(2xe^x\\)"]},{"id":"T45","sec":"gestion","kind":"tf","q":"La marge libre est une partie de la marge totale.","ans":0,"expl":"Marge libre ≤ marge totale. Marge totale : retard possible sans retarder la fin du projet. Marge libre : retard possible sans retarder le début des tâches suivantes.","src":"test","opts":["Vrai","Faux"]},{"id":"T46","sec":"anglais","kind":"single","q":"The Burj Khalifa is ______ building in the world.","ans":0,"expl":"Superlatif d'un adjectif court : <b>the + adjectif-est<\/b> → the tallest.","src":"test","opts":["the tallest","the most tall","the taller"]},{"id":"T47","sec":"fr","kind":"tf","q":"Dans un corpus de synthèse, la thèse de chaque document est la même.","ans":1,"expl":"Les documents traitent le même thème mais avec des points de vue différents, parfois opposés : c'est ce qui permet de les confronter.","src":"test","opts":["Vrai","Faux"]},{"id":"T48","sec":"auto","kind":"single","q":"L'étape initiale est active. On effectue la séquence : appui momentané sur e1, action momentanée sur e2, action maintenue sur e3, action momentanée sur e2. Quel est l'état du système ?","ans":3,"expl":"e1 → divergence en ET : <b>10 et 20<\/b> actives. e2 seul (e3 = 0) : e2·ē3 vrai → 20 laisse place à <b>30<\/b>. On relâche e2 : ē2 vrai → retour à <b>20<\/b> (10 toujours active). e3 maintenu : rien ne se passe. e2 avec e3 : e2·e3 vrai et 10, 20 actives → convergence en ET franchie → <b>étape 0<\/b>.","src":"test","opts":["Seule l'étape 20 est active","Les étapes 10 et 20 sont actives","Seule l'étape 10 est active","L'étape 0 est active","Les étapes 10 et 30 sont actives","Seule l'étape 30 est active"],"img":["q048.png"]},{"id":"T49","sec":"gestion","kind":"tf","q":"Les micro-arrêts sont des arrêts trop courts pour que cela vaille la peine de les prendre en compte.","ans":1,"expl":"Très fréquents, les micro-arrêts pèsent lourd sur le TRS (perte de performance) : on les mesure et on les traite.","src":"test","opts":["Vrai","Faux"]},{"id":"T50","sec":"auto","kind":"match","q":"Identifier les types de capteurs : photos A, B, C et symboles 1, 2, 3.","ans":[0,1,2,1,2,0],"expl":"<b>Barrage<\/b> : émetteur et récepteur dans deux boîtiers face à face (symbole en deux parties). <b>Reflex<\/b> : E/R dans le même boîtier + un réflecteur. <b>Proximité (direct)<\/b> : E/R dans le même boîtier, c'est l'objet qui renvoie la lumière.","src":"test","opts":["Optique de proximité (direct)","Optique barrage","Optique reflex"],"img":["q050.jpg"],"items":["Photo A","Photo B","Photo C","Symbole 1","Symbole 2","Symbole 3"]},{"id":"T51","sec":"anglais","kind":"single","q":"The invention of ______ made realistic painting obsolete.","ans":1,"expl":"La technique / l'art = <b>photography<\/b>. A photograph = une photo ; a photographer = un photographe.","src":"test","opts":["photograph","photography","photographer"]},{"id":"T52","sec":"elec","kind":"single","q":"La plaque d'un réfrigérateur indique W = 216 kWh/an. Quelle est l'énergie absorbée à l'année ?","ans":2,"expl":"1 kWh = 1000 W × 3600 s = 3 600 kJ. Donc 216 × 3 600 = <b>777 600 kJ<\/b>.","src":"test","opts":["60 000 kJ","60 kJ","777 600 kJ","777 600 J"]},{"id":"T53","sec":"gestion","kind":"tf","q":"La standardisation est un élément essentiel du taylorisme.","ans":1,"expl":"Réponse attendue : <b>Faux<\/b>. Le taylorisme (OST) repose sur la division du travail (verticale et horizontale), le chronométrage et le salaire au rendement. La standardisation des produits est associée au <b>fordisme<\/b>.","src":"test","opts":["Vrai","Faux"]},{"id":"T54","sec":"auto","kind":"num","q":"Bascule RS synchrone (front montant de H). À t = 0, Q = 1. Au bout de combien de secondes la sortie Q repassera-t-elle au niveau logique 1 ? (1 carreau = 1 s)","ans":6,"expl":"Fronts montants de H à t = 2, 6, 10, 14 s. À t = 2 : R = 1, S = 0 → Q passe à 0. À t = 6 : R = 0, S = 1 → Q repasse à <b>1<\/b>. Les impulsions de R et S entre deux fronts ne comptent pas : la bascule est synchrone.","src":"test","img":["q054.png"],"tol":0,"unit":"s"},{"id":"T55","sec":"gestion","kind":"tf","q":"On utilise le réseau PERT pour trouver le chemin critique.","ans":0,"expl":"Le PERT ordonne les tâches et donne le chemin critique : la suite de tâches à marge nulle qui fixe la durée du projet.","src":"test","opts":["Vrai","Faux"]},{"id":"T56","sec":"meca","kind":"tf","q":"Un mégapascal équivaut à un newton divisé par un centimètre carré.","ans":1,"expl":"1 MPa = 10<sup>6<\/sup> N/m² = <b>1 N/mm²<\/b>. 1 N/cm² = 10<sup>4<\/sup> Pa = 0,01 MPa.","src":"test","opts":["Vrai","Faux"]},{"id":"T57","sec":"auto","kind":"single","q":"Ce symbole d'un schéma électrique représente :","ans":3,"expl":"Les petits rectangles traversés par le trait sur chaque pôle sont des <b>fusibles<\/b>, intégrés à l'appareil de coupure à 3 pôles (sectionneur porte-fusibles tripolaire).","src":"test","opts":["Un disjoncteur thermique tripolaire","Un disjoncteur magnétique tripolaire","Un disjoncteur magnétothermique tripolaire","Un disjoncteur à fusibles tripolaire"],"img":["q057.png"]},{"id":"T58","sec":"auto","kind":"single","q":"Donner l'équation de S à partir du tableau de Karnaugh :<div class=\"kmap-wrap\"><table class=\"kmap\"><caption>S (lignes : a b, colonnes : c d)<\/caption><tr><th class=\"corner\">ab \\ cd<\/th><th>00<\/th><th>01<\/th><th>11<\/th><th>10<\/th><\/tr><tr><th>00<\/th><td>1<\/td><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><tr><th>01<\/th><td>1<\/td><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><tr><th>11<\/th><td>0<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><th>10<\/th><td>0<\/td><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><\/table><\/div>","ans":1,"expl":"Lignes ab = 00 et 01 (a = 0) entièrement à 1 → terme \\(\\overline a\\). Ligne ab = 10 : 1 pour cd = 11 et 10, soit \\(c=1\\) ; on regroupe avec la ligne 00 (b = 0) → terme \\(\\overline b\\,c\\). Donc \\(S=\\overline a+\\overline b\\,c\\).","src":"test","opts":["\\(S=\\overline a\\,b+\\overline b\\,c\\)","\\(S=\\overline a+\\overline b\\,c\\)","\\(S=\\overline a\\,d+\\overline b\\,c\\)","\\(S=a\\,\\overline c+b\\)","\\(S=a\\,\\overline c+b\\,c\\)"]},{"id":"T59","sec":"anglais","kind":"single","q":"He works hard at this job, and he ______ a good salary.","ans":2,"expl":"On <b>earns<\/b> money / a salary (gagner en travaillant). Win = gagner un match ; gain = prendre (du poids, de l'expérience).","src":"test","opts":["gains","wins","earns"]},{"id":"T60","sec":"auto","kind":"single","q":"Donner le type de capteur ou détecteur ci-contre :","ans":3,"expl":"Émetteur et récepteur dans deux boîtiers face à face, l'objet coupe le faisceau : détecteur <b>barrage<\/b>.","src":"test","opts":["Détecteur de proximité capacitif","Codeur optique de position angulaire","Capteur de position électromécanique","Détecteur photoélectrique « barrage »","Détecteur photoélectrique « reflex »","Détecteur de proximité inductif"],"img":["q060.jpg"]},{"id":"T61","sec":"elec","kind":"single","q":"La puissance moyenne d'un dipôle (régime sinusoïdal) est donnée par :","ans":2,"expl":"\\(P=U_{eff}I_{eff}\\cos\\varphi\\), et comme \\(U_{eff}=\\frac{U_m}{\\sqrt2}\\), \\(I_{eff}=\\frac{I_m}{\\sqrt2}\\) : \\(P=\\frac12U_mI_m\\cos\\varphi\\). \\(U_{eff}I_{eff}\\) seul est la puissance apparente S (en VA).","src":"test","opts":["\\(P=\\dfrac12U_{eff}I_{eff}\\cos\\Delta\\varphi\\)","\\(P=U_{eff}I_{eff}\\)","\\(P=\\dfrac12U_mI_m\\cos\\Delta\\varphi\\)"]},{"id":"T62","sec":"maths","kind":"single","q":"Quelles sont les racines du polynôme \\(P(x)=2x^2+3x-5\\) ?","ans":1,"expl":"\\(\\Delta=9+40=49\\), \\(x=\\dfrac{-3\\pm7}{4}\\) → 1 et −2,5. Astuce : \\(a+b+c=0\\) donc 1 est racine, et l'autre vaut \\(\\frac ca=-\\frac52\\).","src":"test","opts":["−1 et −2,5","1 et −2,5","−1 et 2,5","2,5 et 1"]},{"id":"T63","sec":"auto","kind":"single","q":"Donner l'équation de S à partir du tableau de Karnaugh :<div class=\"kmap-wrap\"><table class=\"kmap\"><caption>S (lignes : a b, colonnes : c d)<\/caption><tr><th class=\"corner\">ab \\ cd<\/th><th>00<\/th><th>01<\/th><th>11<\/th><th>10<\/th><\/tr><tr><th>00<\/th><td>1<\/td><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><tr><th>01<\/th><td>0<\/td><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><tr><th>11<\/th><td>0<\/td><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><th>10<\/th><td>0<\/td><td>0<\/td><td>0<\/td><td>1<\/td><\/tr><\/table><\/div>","ans":0,"expl":"Ligne 00 → \\(\\overline a\\,\\overline b\\). Colonne cd = 10 entièrement à 1 → \\(c\\,\\overline d\\). Carré rows 00-01 × colonnes 01-11 → \\(\\overline a\\,d\\). Carré rows 01-11 × colonnes 11-10 → \\(b\\,c\\). Toutes les cases à 1 sont couvertes, aucune case à 0.","src":"test","opts":["\\(S=\\overline a\\,\\overline b+c\\,\\overline d+\\overline a\\,d+b\\,c\\)","\\(S=\\overline a\\,\\overline b+c\\,\\overline d+\\overline a\\,d+a\\,c\\)","\\(S=\\overline a\\,\\overline b+a\\,\\overline d+\\overline c\\,d+b\\,c\\)","\\(S=\\overline a\\,\\overline b+\\overline c\\,d+a\\,d+\\overline b\\,c\\)","\\(S=\\overline a\\,\\overline b+c\\,d+\\overline a\\,\\overline d+b\\,c\\)"]},{"id":"T64","sec":"gestion","kind":"tf","q":"L'intégration, c'est le contraire de l'externalisation.","ans":0,"expl":"Intégration = faire soi-même (internaliser). Externalisation = confier l'activité à un prestataire.","src":"test","opts":["Vrai","Faux"]},{"id":"T65","sec":"fr","kind":"tf","q":"Un plan Causes / Conséquences / Solutions est un plan analytique.","ans":0,"expl":"Le plan analytique analyse un fait : constat ou causes, conséquences, solutions.","src":"test","opts":["Vrai","Faux"]},{"id":"T66","sec":"meca","kind":"num","q":"Degré d'hyperstatisme du mécanisme ci-contre, avec \\(h=n_s-6(n-1)+m_u+m_i\\) (\\(n_s\\) : inconnues statiques, \\(n\\) : ensembles bâti inclus, \\(m_u=1\\), \\(m_i=3\\)).","ans":0,"expl":"Ensembles : bâti, bras bleu, axe vert, pistons jaune et violet → n = 5. Liaisons : pivot vert/bleu (5), pivot bleu/bâti (5), deux sphère-plan (1 + 1), deux pivots glissants (4 + 4) → n<sub>s<\/sub> = 20. h = 20 − 6×4 + 1 + 3 = <b>0<\/b> : mécanisme isostatique.","src":"test","img":["q066.png"],"tol":0,"unit":""},{"id":"T67","sec":"gestion","kind":"tf","q":"La division parallèle du travail fait partie du taylorisme.","ans":0,"expl":"Réponse attendue : <b>Vrai<\/b>. Le taylorisme divise le travail horizontalement (tâches parcellisées réalisées en parallèle) et verticalement (conception / exécution).","src":"test","opts":["Vrai","Faux"]},{"id":"T68","sec":"meca","kind":"single","q":"Quel est le torseur cinématique de la liaison appui plan de normale \\(\\vec z\\) ci-contre ?","ans":1,"expl":"Appui plan : 3 degrés de liberté → les 2 translations dans le plan (V<sub>x<\/sub>, V<sub>y<\/sub>) et la rotation autour de la normale (ω<sub>z<\/sub>).","src":"test","opts":["\\(\\begin{Bmatrix}0&V_{Ox}\\\\ \\omega_y&V_{Oy}\\\\ \\omega_z&0\\end{Bmatrix}_{O,\\mathcal R}\\)","\\(\\begin{Bmatrix}0&V_{Ox}\\\\ 0&V_{Oy}\\\\ \\omega_z&0\\end{Bmatrix}_{O,\\mathcal R}\\)","\\(\\begin{Bmatrix}0&V_{Ox}\\\\ 0&0\\\\ 0&0\\end{Bmatrix}_{O,\\mathcal R}\\)","\\(\\begin{Bmatrix}\\omega_x&V_{Ox}\\\\ \\omega_y&V_{Oy}\\\\ \\omega_z&0\\end{Bmatrix}_{O,\\mathcal R}\\)"],"img":["q068.png"]},{"id":"T69","sec":"auto","kind":"single","q":"Donner le nom du symbole :","ans":2,"expl":"Bobine (rectangle avec A1/A2) = <b>relai<\/b> ; trait de contact avec NO = <b>contact<\/b>. Bobine simple = relai ordinaire ; case <b>noircie<\/b> = relai temporisé <b>au repos<\/b> (retombée retardée) ; case avec une <b>croix<\/b> = relai temporisé <b>à l'action<\/b> (appel retardé). Sur un contact, le petit demi-cercle (« parachute ») indique la temporisation : il freine le contact dans un seul sens, à la fermeture (action retardée) ou à l'ouverture (repos retardé).","src":"test","opts":["Relai de commande","Relai de commande à action retardée","Relai de commande à repos retardé","Contact de relai de commande","Contact de relai de commande à action retardée","Contact de relai de commande à repos retardé"],"img":["q069.png"]},{"id":"T70","sec":"meca","kind":"text","q":"Quelle est la liaison réalisée par un contact cylindrique de courte portée ? <i>(seul le nom de la liaison est attendu)<\/i>","ans":["lineaire annulaire","linéaire annulaire","sphere cylindre","sphère-cylindre","annulaire"],"expl":"<b>Linéaire annulaire<\/b> (sphère-cylindre), comme à la question 34. La rotule correspond à un contact sphérique.","src":"test","note":"Sur ton corrigé, « Rotule » était écrit pour cette question : ce n'est pas cohérent avec la question 34 du même test.","shown":"linéaire annulaire"},{"id":"T71","sec":"auto","kind":"multi","q":"En logique, \\(\\overline A+\\overline B=\\) ?","ans":[1],"expl":"Théorème de De Morgan : \\(\\overline A+\\overline B=\\overline{A\\cdot B}\\) et \\(\\overline A\\cdot\\overline B=\\overline{A+B}\\).","src":"test","opts":["\\(A\\cdot B\\)","\\(\\overline{A\\cdot B}\\)","\\(A+B\\)","\\(\\overline{A+B}\\)"]},{"id":"T72","sec":"constr","kind":"text","q":"Identifier la chaîne de cotes permettant d'installer la cote condition b. <i>(un mot : la couleur)<\/i>","ans":["bleu","bleue"],"expl":"Une chaîne de cotes part d'une surface terminale de la cote condition, traverse chaque pièce par ses surfaces de contact (une seule cote par pièce) et revient à l'autre surface terminale. C'est la chaîne <b>bleue<\/b>.","src":"test","img":["q072.png"],"shown":"bleu"},{"id":"T73","sec":"elec","kind":"single","q":"Comment calcule-t-on la valeur efficace d'un signal sinusoïdal ?","ans":2,"expl":"\\(U_{eff}=\\sqrt{\\langle u^2\\rangle}\\) (RMS : root mean square). Pour une sinusoïde : \\(U_{eff}=\\dfrac{U_{max}}{\\sqrt2}\\).","src":"test","opts":["En prenant la racine carrée de l'amplitude.","En multipliant l'amplitude par 2π.","En prenant la racine carrée de la moyenne des carrés des valeurs instantanées sur une période.","En multipliant l'amplitude par la fréquence."]},{"id":"T74","sec":"elec","kind":"single","q":"On dispose du diagramme de Bode en gain ci-contre. Quelle affirmation est <b>erronée<\/b> ?","ans":0,"expl":"Pente : de −60 dB (log = −3) à 0 dB (log = 0), soit <b>+20 dB/décade<\/b> → filtre du <b>1er ordre<\/b> (un 2nd ordre donnerait 40 dB/décade). C'est bien un passe-haut, de bande passante ω > ω<sub>c<\/sub>.","src":"test","opts":["Le filtre correspondant est un filtre du second ordre.","Le filtre correspondant est un filtre passe-haut.","La bande passante à −3 dB correspond aux pulsations telles que \\(\\log\\frac{\\omega}{\\omega_c}>0\\)."],"img":["q074.png"]},{"id":"T75","sec":"constr","kind":"num","q":"Montage de la bielle 2 : la cote condition a est comprise entre 0,1 et 0,15 mm et la cote a2 vaut 15 H7 (\\(15^{+0{,}018}_{\\ 0}\\)). Calculer la valeur <b>minimale<\/b> de la cote a3 (au millième).","ans":15.118,"expl":"a = a3 − a2. a<sub>min<\/sub> = a3<sub>min<\/sub> − a2<sub>max<\/sub> → a3<sub>min<\/sub> = 0,1 + 15,018 = <b>15,118 mm<\/b>.","src":"test","img":["q075.png"],"tol":0.0005,"unit":"mm"},{"id":"T76","sec":"auto","kind":"match","q":"Associez les désignations aux symboles 1 à 6 (ou « Non représenté »).","ans":[2,6,3,6,4,6,0,5,1],"expl":"Désignation x/y : <b>x = nombre d'orifices<\/b> (comptés sur une case), <b>y = nombre de positions<\/b> (nombre de cases). 1 : 1 case, 2 orifices → 2/1. 2 : 2 cases, 5 orifices → 5/2. 3 : 4/2. 4 : 3 cases, 4 orifices → 4/3. 5 : 2/2. 6 : 3/2.","src":"test","opts":["Symbole 1","Symbole 2","Symbole 3","Symbole 4","Symbole 5","Symbole 6","Non représenté"],"img":["q076.png"],"items":["Distributeur 4/2","Distributeur 2/3","Distributeur 4/3","Distributeur 5/4","Distributeur 2/2","Distributeur 1/1","Distributeur 2/1","Distributeur 3/2","Distributeur 5/2"]},{"id":"T77","sec":"gestion","kind":"tf","q":"Un TRS trop bas signifie que les machines de l'entreprise ne sont pas rapides.","ans":1,"expl":"TRS = disponibilité × performance × qualité. Un TRS bas peut venir des pannes et réglages, des ralentissements ou des rebuts, pas seulement de la vitesse.","src":"test","opts":["Vrai","Faux"]},{"id":"T78","sec":"gestion","kind":"single","q":"Stock final d'une marchandise : livraison de 150 unités, stock initial avant livraison de 30 unités, sorties de 140 unités, stock de sécurité de 10 unités.","ans":2,"expl":"Stock final = stock initial + entrées − sorties = 30 + 150 − 140 = <b>40<\/b>. Le stock de sécurité est un seuil, il ne s'ajoute pas.","src":"test","opts":["20 unités","10 unités","40 unités","30 unités"]},{"id":"T79","sec":"maths","kind":"single","q":"Quel est le DL à l'ordre 3 en 0 de \\(\\sin(2x)\\) ?","ans":0,"expl":"\\(\\sin u=u-\\dfrac{u^3}{6}+u^3\\varepsilon(u)\\). Avec \\(u=2x\\) : \\(2x-\\dfrac{8x^3}{6}+x^3\\varepsilon(x)\\). La 3e proposition oublie le reste \\(x^3\\varepsilon(x)\\) : un DL s'écrit toujours avec son reste.","src":"test","opts":["\\(2x-\\dfrac{8x^3}{3!}+x^3\\varepsilon(x)\\)","\\(2x+\\dfrac{8x^3}{3}+x^3\\varepsilon(x)\\)","\\(2x-\\dfrac{8x^3}{6}\\)","\\(2x-\\dfrac{2x^3}{3}+x^3\\varepsilon(x)\\)"]},{"id":"T80","sec":"meca","kind":"match","q":"Attribuer à chaque torseur des actions mécaniques transmissibles la liaison correspondante.","ans":[0,1,2,3],"expl":"Une composante nulle = un mouvement possible. 1 : seuls Z et M → linéaire rectiligne (normale z, droite de contact selon x). 2 : seul X est nul → translation selon x → glissière. 3 : moment nul en O → 3 rotations → rotule. 4 : Z, L, M → appui plan de normale z.","src":"test","opts":["Linéaire rectiligne","Glissière","Rotule","Appui plan","Pivot","Linéaire annulaire"],"items":["\\(\\left\\{T_{1\\to2}\\right\\}=\\begin{Bmatrix}0&0\\\\ 0&M_{A}\\\\ Z&0\\end{Bmatrix}_{A,(\\vec x,\\vec y,\\vec z)}\\)","\\(\\left\\{T_{1\\to2}\\right\\}=\\begin{Bmatrix}0&L_{A}\\\\ Y&M_{A}\\\\ Z&N_{A}\\end{Bmatrix}_{A,(\\vec x,\\vec y,\\vec z)}\\)","\\(\\left\\{T_{1\\to2}\\right\\}=\\begin{Bmatrix}X&0\\\\ Y&0\\\\ Z&0\\end{Bmatrix}_{O,(\\vec x,\\vec y,\\vec z)}\\)","\\(\\left\\{T_{1\\to2}\\right\\}=\\begin{Bmatrix}0&L_{A}\\\\ 0&M_{A}\\\\ Z&0\\end{Bmatrix}_{A,(\\vec x,\\vec y,\\vec z)}\\)"]},{"id":"T81","sec":"constr","kind":"tf","q":"Un matériau déformé plastiquement revient à sa forme initiale après avoir relâché la contrainte.","ans":1,"expl":"Déformation <b>élastique<\/b> = réversible. Déformation <b>plastique<\/b> = permanente.","src":"test","opts":["Vrai","Faux"]},{"id":"T82","sec":"constr","kind":"match","q":"Attribuer la nature de trait à chaque type d'élément représenté.","ans":[0,1,2,3,4],"expl":"Arêtes vues : continu fort. Arêtes cachées : interrompu (pointillé) fin. Axes : mixte fin. Plan de coupe : mixte fin renforcé aux extrémités. Fond de filet, hachures, cotes : continu fin.","src":"test","opts":["Trait continu fin","Trait mixte fin","Trait mixte fin à extrémités en trait fort","Trait continu fort","Trait interrompu fin"],"items":["Filetage (fond de filet)","Axe de révolution ou de symétrie","Plan de coupe","Forme réelle vue","Forme réelle cachée"]},{"id":"T83","sec":"elec","kind":"single","q":"P est la puissance absorbée par un système (W) et W l'énergie absorbée pendant un temps t (J). Quelle est la bonne affirmation ?","ans":2,"expl":"La puissance est une énergie par unité de temps : <b>P = W / t<\/b> (W = P·t).","src":"test","opts":["P·W = t","t = P/W","P = W/t"]},{"id":"T84","sec":"auto","kind":"single","q":"Donner le nom du symbole :","ans":0,"expl":"Bobine (rectangle avec A1/A2) = <b>relai<\/b> ; trait de contact avec NO = <b>contact<\/b>. Bobine simple = relai ordinaire ; case <b>noircie<\/b> = relai temporisé <b>au repos<\/b> (retombée retardée) ; case avec une <b>croix<\/b> = relai temporisé <b>à l'action<\/b> (appel retardé). Sur un contact, le petit demi-cercle (« parachute ») indique la temporisation : il freine le contact dans un seul sens, à la fermeture (action retardée) ou à l'ouverture (repos retardé).","src":"test","opts":["Relai de commande","Relai de commande à action retardée","Relai de commande à repos retardé","Contact de relai de commande","Contact de relai de commande à action retardée","Contact de relai de commande à repos retardé"],"img":["q084.png"]},{"id":"T85","sec":"fr","kind":"tf","q":"La neutralité est obligatoire en synthèse.","ans":0,"expl":"La synthèse restitue objectivement les idées des documents, sans donner son avis.","src":"test","opts":["Vrai","Faux"]},{"id":"T86","sec":"maths","kind":"single","q":"Une primitive de \\(\\dfrac{x}{1+3x^2}\\) est :","ans":2,"expl":"Forme \\(\\frac{u'}{u}\\) : avec \\(u=1+3x^2\\), \\(u'=6x\\), donc \\(\\dfrac{x}{1+3x^2}=\\dfrac16\\cdot\\dfrac{u'}{u}\\) → primitive \\(\\dfrac16\\ln(1+3x^2)\\).","src":"test","opts":["\\(\\dfrac{3}{1+3x}\\)","\\(-3\\ln(1+x^2)\\)","\\(\\dfrac16\\ln(1+3x^2)\\)","\\(\\dfrac13\\arctan(3x^2)\\)","\\(\\dfrac13\\ln(1+x^2)\\)"]},{"id":"T87","sec":"gestion","kind":"multi","q":"La stratégie de diversification présente les caractéristiques suivantes :","ans":[1,2,3,4],"expl":"La diversification (nouveaux produits / marchés) répartit les risques et peut créer synergies et économies d'échelle. Elle n'est pas obligatoire : beaucoup d'entreprises pérennes restent spécialisées.","src":"test","opts":["Une entreprise doit absolument se diversifier pour assurer sa pérennité.","Elle pourrait permettre de réaliser des économies d'échelle.","Elle pourrait entraîner des effets de synergie.","Elle permet d'augmenter la notoriété même en cas d'échec de la nouvelle activité.","Une meilleure répartition des risques."]},{"id":"T88","sec":"gestion","kind":"single","q":"La structure qui permet à certains managers de combiner une responsabilité opérationnelle et une responsabilité fonctionnelle ou géographique, c'est :","ans":2,"expl":"Structure <b>matricielle<\/b> : double rattachement (par projet / produit et par fonction ou zone).","src":"test","opts":["la structure hiérarchico-fonctionnelle","la structure fonctionnelle","la structure matricielle","la structure divisionnelle","la structure hiérarchique"]},{"id":"T89","sec":"gestion","kind":"multi","q":"Concernant la Société par Actions Simplifiée (SAS), cochez les réponses justes :","ans":[0,1,3],"expl":"SAS : statuts très libres, responsabilité limitée aux apports, capital librement fixé, dirigée obligatoirement par un <b>Président<\/b>, 1 associé minimum (SASU).","src":"test","opts":["Créer une société dont le statut est souple et la responsabilité limitée aux apports.", e type de capteur ou détecteur ci-contre :","ans":5,"expl":"Oscillateur + bobine qui détecte un <b>objet métallique<\/b> sans contact : détecteur de proximité <b>inductif<\/b>.","src":"test","opts":["Détecteur de proximité capacitif","Codeur optique de position angulaire","Capteur de position électromécanique","Détecteur photoélectrique « barrage »","Détecteur photoélectrique « reflex »","Détecteur de proximité inductif"],"img":["q094.jpg"]},{"id":"T95","sec":"elec","kind":"single","q":"Quelle est la fonction réalisée par ce montage ?","ans":0,"expl":"La résistance R<sub>2<\/sub> renvoie la sortie sur l'entrée <b>+<\/b> : réaction positive → l'ALI sature. Avec V<sub>e<\/sub> sur l'entrée −, c'est un <b>comparateur à hystérésis<\/b> (trigger de Schmitt inverseur), de seuils ± R<sub>1<\/sub>/(R<sub>1<\/sub>+R<sub>2<\/sub>)·V<sub>sat<\/sub>.","src":"test","opts":["Comparateur à hystérésis","Dérivateur","Amplificateur inverseur"],"img":["q095.png"]},{"id":"T96","sec":"elec","kind":"single","q":"On dispose du diagramme de Bode en gain ci-contre. Quelle affirmation est <b>erronée<\/b> ?","ans":1,"expl":"Le gain maximal G<sub>0<\/sub> est <b>au-dessus de 0 dB<\/b> (gain > 1) : un filtre passif ne peut pas amplifier, il faut un filtre <b>actif<\/b>. Le creux central en fait bien un coupe-bande.","src":"test","opts":["Le filtre correspondant est un filtre coupe-bande.","Le filtre correspondant est un filtre passif.","La bande passante à −3 dB est \\(]-\\infty;\\log x_1[\\,\\cup\\,]\\log x_2;+\\infty[\\)."],"img":["q096.png"]},{"id":"T97","sec":"maths","kind":"single","q":"Le module du produit des complexes \\(z_1=-2+2i\\), \\(z_2=-1+2i\\), \\(z_3=-1+3i\\) est :","ans":2,"expl":"Module d'un produit = produit des modules : \\(|z_1|=\\sqrt8\\), \\(|z_2|=\\sqrt5\\), \\(|z_3|=\\sqrt{10}\\) → \\(\\sqrt{8\\times5\\times10}=\\sqrt{400}=20\\).","src":"test","opts":["\\(4\\sqrt{10}\\)","\\(3\\sqrt{10}\\)","\\(20\\)","\\(10\\sqrt2\\)"]},{"id":"T98","sec":"gestion","kind":"tf","q":"La méthode des cinq zéros est d'origine américaine.","ans":1,"expl":"Elle est d'origine <b>japonaise<\/b> (toyotisme) : zéro panne, zéro défaut, zéro stock, zéro délai, zéro papier.","src":"test","opts":["Vrai","Faux"]},{"id":"T99","sec":"gestion","kind":"single","q":"Quel est le temps requis si le TRS est égal à 80 % et le temps utile à 6,75 heures ?","ans":3,"expl":"TRS = temps utile / temps requis → temps requis = 6,75 / 0,8 = 8,4375 h = 506,25 min ≈ <b>506 min<\/b>.","src":"test","opts":["512 minutes","500 minutes","518 minutes","506 minutes"]},{"id":"T100","sec":"meca","kind":"match","q":"Complétez les mouvements relatifs possibles de chaque liaison.","ans":[0,1,2],"expl":"Pivot glissant : rotation + translation le long de l'axe. Rotule : 3 rotations. Linéaire annulaire : 3 rotations + translation selon l'axe.","src":"test","opts":["Ry, Ty","Rx, Ry, Rz","Rx, Ry, Rz, Ty","Ty","Ry"],"items":["Pivot glissant d'axe y","Rotule de centre O","Linéaire annulaire d'axe y"]},{"id":"T101","sec":"meca","kind":"single","q":"Comment définit-on le moment au point O d'une force appliquée au point A ?","ans":0,"expl":"\\(\\overrightarrow{M_O}=\\overrightarrow{OA}\\wedge\\vec F=\\vec F\\wedge\\overrightarrow{AO}\\) (le produit vectoriel change de signe quand on inverse l'ordre). Un moment est un vecteur : ce n'est jamais un produit scalaire.","src":"test","opts":["\\(\\overrightarrow{M_O}(\\vec F_A)=\\vec F_A\\wedge\\overrightarrow{AO}\\)","\\(\\overrightarrow{M_O}(\\vec F_A)=\\vec F_A\\cdot\\overrightarrow{OA}\\)","\\(\\overrightarrow{M_O}(\\vec F_A)=\\vec F_A\\cdot\\overrightarrow{AO}\\)","\\(\\overrightarrow{M_O}(\\vec F_A)=\\vec F_A\\wedge\\overrightarrow{OA}\\)"]},{"id":"T102","sec":"maths","kind":"single","q":"À quelle courbe correspond la fonction \\(f_2(x)=x^2+x+3\\) ?","ans":0,"expl":"\\(f_2(0)=3\\) : la courbe passe par (0 ; 3). Coefficient de \\(x^2\\) positif → parabole ouverte vers le haut. Sommet en \\(x=-\\frac{b}{2a}=-0{,}5\\), \\(f_2(-0{,}5)=2{,}75\\) → <b>C1<\/b>.","src":"test","opts":["C1","C2","C3","C4","C5"],"img":["q102.png"]},{"id":"T103","sec":"auto","kind":"match","q":"Grafcet : faites correspondre les débuts de phrase et les fins.","ans":[0,1,2,3,4],"expl":"Une étape est active ou inactive ; une transition est validée (étapes amont actives) puis franchie (réceptivité vraie) ; une réceptivité est vraie ou fausse ; le franchissement désactive les étapes amont et active les étapes aval.","src":"test","opts":["active ou inactive","validée puis franchie","vraie ou fausse","validée","inactives"],"note":"Question reformulée : l'énoncé d'origine utilisait plusieurs fois les mêmes débuts de phrase.","items":["Une étape peut être…","Une transition peut être…","Une réceptivité peut être…","Une étape active permet à la transition suivante d'être…","Le franchissement d'une transition rend les étapes précédentes…"]},{"id":"T104","sec":"meca","kind":"multi","q":"Les informations présentes sur un schéma cinématique sont :","ans":[1,3],"expl":"Le schéma cinématique est une représentation simplifiée : il montre les liaisons, leur orientation et leurs positions relatives, sans forme ni dimension réelle des pièces.","src":"test","opts":["les formes des pièces","l'orientation des liaisons","la dimension des pièces","les positions relatives des centres de contact"]},{"id":"T105","sec":"anglais","kind":"single","q":"Thank you for taking time to answer our questions. We now have all the ______ we need.","ans":0,"expl":"<b>Information<\/b> est indénombrable en anglais : jamais de « s ».","src":"test","opts":["information","informations","informed"]},{"id":"T106","sec":"elec","kind":"single","q":"L'application du théorème de Millman au potentiel \\(V_0\\) dans le circuit ci-contre donne :","ans":1,"expl":"Millman : \\(V_0=\\dfrac{\\sum V_i/R_i}{\\sum 1/R_i}\\), une moyenne des potentiels pondérée par les conductances. Vérif d'unité : V au numérateur.","src":"test","opts":["\\(V_0=\\dfrac{\\frac1{R_1}+\\frac1{R_2}+\\frac1{R_3}}{\\frac{V_1}{R_1} ase avec une <b>croix<\/b> = relai temporisé <b>à l'action<\/b> (appel retardé). Sur un contact, le petit demi-cercle (« parachute ») indique la temporisation : il freine le contact dans un seul sens, à la fermeture (action retardée) ou à l'ouverture (repos retardé).","src":"test","opts":["Relai de commande","Relai de commande à action retardée","Relai de commande à repos retardé","Contact de relai de commande","Contact de relai de commande à action retardée","Contact de relai de commande à repos retardé"],"img":["q119.png"]},{"id":"T120","sec":"constr","kind":"single","q":"La MIP signifie :","ans":3,"expl":"<b>MIP = mise en position<\/b> (placer la pièce de façon isostatique) ; MAP = maintien en position (la serrer).","src":"test","opts":["Aucune des réponses proposées","Maintien indirect de position","Maintien indifférencié de position","Mise en position"]},{"id":"T121","sec":"elec","kind":"single","q":"Dans le circuit RC ci-contre (régime sinusoïdal imposé par \\(e(t)=E\\cos\\omega t\\)), quelle est l'équation différentielle vérifiée par \\(u(t)\\) ?","ans":0,"expl":"Loi des mailles : \\(e=Ri+u\\) avec \\(i=C\\dfrac{du}{dt}\\), donc \\(RC\\dfrac{du}{dt}+u=e\\), soit \\(\\dfrac{du}{dt}+\\dfrac{u}{RC}=\\dfrac{e}{RC}\\).","src":"test","opts":["\\(\\dfrac{du}{dt}+\\dfrac{1}{RC}u(t)=\\dfrac{e(t)}{RC}\\)","\\(\\dfrac{du}{dt}+\\dfrac{1}{RC}u(t)=0\\)","\\(u(t)+\\dfrac1{RC}\\dfrac{du}{dt}=e(t)\\)","\\(\\dfrac{du}{dt}+\\dfrac{1}{RC}u(t)=e(t)\\)"],"img":["q121.png"],"note":"Dans le test d'origine, la réponse surlignée était du/dt + u/RC = e(t), sans 1/RC devant e : c'est une coquille. L'équation exacte est RC·du/dt + u = e(t)."},{"id":"T122","sec":"maths","kind":"single","q":"Une solution de l'équation différentielle \\(-\\dfrac13y'-3y=0\\) est :","ans":1,"expl":"On multiplie par \\(-3\\) : \\(y'+9y=0\\), donc \\(y=Ce^{-9x}\\).","src":"test","opts":["\\(-\\dfrac13e^{3x}\\)","\\(e^{-9x}\\)","\\(e^{-3x}\\)","\\(-e^{3x}\\)"]},{"id":"T123","sec":"elec","kind":"single","q":"Un dipôle est traversé par un courant i, de charge q pendant un temps t avec une différence de potentiel U. Quelle est la bonne affirmation ?","ans":2,"expl":"Le courant est le débit de charges : <b>i = dq/dt<\/b>.","src":"test","opts":["U = di/dt","q = dU/dt","i = dq/dt","i = dU/dt"]},{"id":"T124","sec":"auto","kind":"single","q":"Donner le nom du symbole :","ans":5,"expl":"Bobine (rectangle avec A1/A2) = <b>relai<\/b> ; trait de contact avec NO = <b>contact<\/b>. Bobine simple = relai ordinaire ; case <b>noircie<\/b> = relai temporisé <b>au repos<\/b> (retombée retardée) ; case avec une <b>croix<\/b> = relai temporisé <b>à l'action<\/b> (appel retardé). Sur un contact, le petit demi-cercle (« parachute ») indique la temporisation : il freine le contact dans un seul sens, à la fermeture (action retardée) ou à l'ouverture (repos retardé).","src":"test","opts":["Relai de commande","Relai de commande à action retardée","Relai de commande à repos retardé","Contact de relai de commande","Contact de relai de commande à action retardée","Contact de relai de commande à repos retardé"],"img":["q124.png"]},{"id":"T125","sec":"meca","kind":"match","q":"Attribuer à chaque effort le calcul correspondant.","ans":[0,1,2,3],"expl":"Ressort : F = k·x (k en N/m). Couple : C = F·d. Poids : P = m·g. Pression : p = F/S, donc F = p·S.","src":"test","opts":["F = k·x","C = F·d","P = m·g","F = p·S","P = m/g","F = p/S"],"note":"Le test d'origine proposait « P = m/g » et « F = p/S » : ce sont des coquilles, les formules exactes sont P = m·g et F = p·S.","items":["Force de ressort","Couple de force","Poids","Force de pression"]},{"id":"T126","sec":"maths","kind":"single","q":"Quelle est la forme trigonométrique de \\(-7+7i\\) ?","ans":1,"expl":"Module : \\(\\sqrt{49+49}=7\\sqrt2\\). \\(\\cos\\theta=-\\frac{\\sqrt2}2\\), \\(\\sin\\theta=+\\frac{\\sqrt2}2\\) → 2e quadrant : \\(\\theta=\\frac{3\\pi}4\\).","src":"test","opts":["\\(7\\sqrt2\\left(\\cos\\frac{5\\pi}4+i\\sin\\frac{5\\pi}4\\right)\\)","\\(7\\sqrt2\\left(\\cos\\frac{3\\pi}4+i\\sin\\frac{3\\pi}4\\right)\\)","\\(7\\sqrt2\\left(\\cos\\left(-\\frac{\\pi}4\\right)+i\\sin\\left(-\\frac{\\pi}4\\right)\\right)\\)"]},{"id":"T127","sec":"maths","kind":"multi","q":"Quel complexe est le résultat du quotient de \\(2{,}5e^{-i\\pi/3}\\) par \\(e^{i\\,11\\pi/3}\\) ? <i>(plusieurs réponses possibles)<\/i>","ans":[0,3],"expl":"On divise les modules (2,5 / 1) et on soustrait les arguments : \\(-\\frac{\\pi}3-\\frac{11\\pi}3=-\\frac{12\\pi}3=-4\\pi\\). Or \\(e^{-4i\\pi}=1\\) : le quotient vaut 2,5 = 5/2. Les écritures a et d sont égales.","src":"test","opts":["\\(2{,}5e^{-i\\frac{12\\pi}{3}}\\)","\\(2{,}5e^{i\\frac{13\\pi}{12}}\\)","\\(\\dfrac52e^{i\\frac{10\\pi}{3}}\\)","\\(\\dfrac52\\)"],"note":"La correction du test ne surlignait que la première écriture ; la dernière (5/2) est le même nombre."},{"id":"T128","sec":"auto","kind":"tf","q":"« ET » est un connecteur logique.","ans":0,"expl":"ET, OU, NON (et leurs combinaisons NAND, NOR, XOR) sont les opérateurs logiques de base.","src":"test","opts":["Vrai","Faux"]},{"id":"T129","sec":"auto","kind":"match","q":"Associer les mots aux images A à E.","ans":[3,2,0,4,1],"expl":"A : électrodistributeur (bobines aux extrémités). B : vérins. C : bouton poussoir (tête de commande). D : capteur de position à galet. E : nourrice (bloc de distribution d'air avec raccords).","src":"test","opts":["A","B","C","D","E"],"img":["q129.jpg"],"items":["Capteur","Bouton poussoir","Distributeur","Nourrice","Vérin"]},{"id":"T130","sec":"constr","kind":"single","q":"La MIP/MAP est une opération réalisée :","ans":0,"expl":"Toute pièce usinée doit être mise et maintenue en position, quel que soit le procédé ou la machine.","src":"test","opts":["En tournage et en fraisage","En MOCN uniquement","En tournage conventionnel uniquement","En fraisage numérique uniquement","En conventionnel uniquement"]},{"id":"T131","sec":"auto","kind":"single","q":"Donner le type de capteur ou détecteur ci-contre :","a
